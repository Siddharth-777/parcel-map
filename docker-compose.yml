services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: parcelmap
      POSTGRES_PASSWORD: parcelmap
      POSTGRES_DB: parcelmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://parcelmap:parcelmap@db:5432/parcelmap
    depends_on:
      - db

volumes:
  pgdata:

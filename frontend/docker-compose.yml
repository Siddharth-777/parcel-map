services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: parcelmap
      POSTGRES_PASSWORD: parcelmap
      POSTGRES_DB: parcelmap
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./BACKEND/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelmap"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./BACKEND
    environment:
      DATABASE_URL: postgresql://parcelmap:parcelmap@db:5432/parcelmap
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
